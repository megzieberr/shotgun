<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Shotgun</title>
<meta name="description" content="One tap before a drive stocks your Spotify queue with a flow-ordered set of songs." />
<meta name="theme-color" content="#0b0e14" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" href="icons/favicon-32.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div class="app-shell">

  <!-- ================= HOME (pre-drive) ================= -->
  <section id="view-home" class="view is-active" aria-label="Pre-drive">
    <div class="top-bar">
      <div class="wordmark">
        <span class="brand">SHOTGUN</span>
        <span class="tagline">Good with the aux since 07:00</span>
      </div>
      <div style="display:flex; align-items:center; gap:12px;">
        <span class="clock" id="clock" aria-live="off">--:--</span>
        <button class="icon-btn" id="btn-open-settings" aria-label="Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.96 19a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.04H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.83a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1.04-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15.04 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9c.53.14 1 .47 1.3.9"/></svg>
        </button>
      </div>
    </div>

    <p class="section-label">Pick your drive's anchor</p>
    <div class="mood-grid" id="mood-grid">
      <!-- mood tiles injected by app.js from MOOD_PRESETS -->
    </div>

    <button class="just-play-tile" id="btn-just-play" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="1.2" fill="currentColor" stroke="none"/><circle cx="16" cy="8" r="1.2" fill="currentColor" stroke="none"/><circle cx="8" cy="16" r="1.2" fill="currentColor" stroke="none"/><circle cx="16" cy="16" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/></svg>
      <span>
        Just Play
        <span class="just-play-sub">App picks from what it's learned</span>
      </span>
    </button>

    <p class="section-label">This vibe</p>
    <div class="seed-search">
      <input type="text" id="seed-input" placeholder="Search a song to anchor the drive to…" autocomplete="off" />
      <div class="seed-results" id="seed-results"></div>
      <div class="seed-picked" id="seed-picked">
        <div class="seed-picked-text">Anchored to <b id="seed-picked-title"></b></div>
        <button class="seed-clear" id="seed-clear" type="button">clear</button>
      </div>
    </div>
    <button class="btn btn-primary" id="btn-stock-seed" type="button" style="display:none; margin-top:12px; width:100%;">
      Stock this vibe
    </button>

    <p class="section-label">Drive length</p>
    <div class="chip-row" id="length-chips"></div>
    <p class="drive-hint" id="drive-hint"></p>
  </section>

  <!-- ================= STOCKING ================= -->
  <section id="view-stocking" class="view stocking-view" aria-label="Stocking your queue">
    <div class="eq-visualizer" aria-hidden="true">
      <span class="bar"></span><span class="bar"></span><span class="bar"></span>
      <span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
    </div>
    <h2 id="stocking-title">Stocking your queue…</h2>
    <p class="stocking-sub" id="stocking-sub"></p>
  </section>

  <!-- ================= CONFIRM ================= -->
  <section id="view-confirm" class="view" aria-label="Queue ready">
    <div class="confirm-header">
      <div class="confirm-check">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <h2>You're set.</h2>
      <p class="confirm-sub">Drive safe.</p>
      <p class="confirm-meta" id="confirm-meta"></p>
    </div>

    <div class="track-list" id="track-list"></div>

    <div class="confirm-footer">
      <button class="btn btn-primary" id="btn-plan-another" type="button">Plan another drive</button>
    </div>
  </section>

  <!-- ================= SETTINGS ================= -->
  <section id="view-settings" class="view" aria-label="Settings">
    <div class="top-bar">
      <button class="icon-btn" id="btn-close-settings" aria-label="Back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h2 style="font-size:19px;">Settings</h2>
      <span style="width:44px;"></span>
    </div>

    <div class="settings-row">
      <p class="settings-label">Default drive length</p>
      <div class="chip-row" id="settings-length-chips"></div>
    </div>

    <div class="settings-row">
      <p class="settings-label">Account</p>
      <div class="settings-inline">
        <div>
          <div class="settings-value">Spotify</div>
          <div class="settings-hint">Coming in a later build</div>
        </div>
        <span class="pill-status">Not connected</span>
      </div>
      <button class="btn btn-secondary" style="margin-top:14px; width:100%;" disabled>Connect Spotify</button>
    </div>

    <div class="settings-row">
      <p class="settings-label">Session</p>
      <button class="btn btn-secondary" style="width:100%;" disabled>Log out</button>
    </div>

    <p class="about-line">Shotgun · scaffold build · local mock data</p>
  </section>

</div>

<div class="toast" id="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
